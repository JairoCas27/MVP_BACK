databases:
  - name: polleria-db
    plan: free

services:
  - type: web
    name: mvp-back
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 run:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polleria-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOWED_ORIGINS
        value: https://lafogatapolleria999.vercel.app,https://lafogatapolleria999-git-dev-jairocastillo874-3299s-projects.vercel.app
