databases:
  - name: polleria-db
    plan: free

services:
  - type: web
    name: mvp-back
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 "app:create_app()"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polleria-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0